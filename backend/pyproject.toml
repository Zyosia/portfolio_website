[project]
name = "portfolio-api"
version = "0.1.0"
description = "Backend API of the portfolio website (contact form today, AI chatbot later)."
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.165.0",
    "pydantic-settings>=2.16.3",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
]

# --- Ruff -------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "S",        # bandit (security)
    "A",        # shadowed builtins
    "C4",       # comprehensions
    "SIM",      # simplify
    "RET",      # return statements
    "PT",       # pytest style
    "PTH",      # pathlib
    "ASYNC",    # async pitfalls
    "T20",      # no print
    "LOG", "G", # logging
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
# Asserts are how pytest works; test secrets are fake.
"tests/**" = ["S101", "S105", "S106"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency injection idiom.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Query"]

# --- mypy -------------------------------------------------------------------
[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# --- pytest -----------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--cov=app",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-fail-under=80",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["app"]
