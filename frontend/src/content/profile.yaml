# Site owner identity, one entry per locale (en, fr). Validated by `profileSchema` in
# src/lib/schemas.ts. Sources: public/cv-en.pdf and public/cv-fr.pdf. Pitch and bio are drafts.
# Photo: square image in src/assets/; 800x800 or more keeps it sharp on high-density screens.

en:
  name: Naël Charvet
  jobTitle: Software Engineer, Software Development & AI
  location: Paris, France
  photo: ../assets/profile.jpg
  photoAlt: Portrait of Naël Charvet, smiling, wearing round glasses and a dark shirt
  pitch: >-
    Software engineer focused on software development and AI, with experience in full-stack
    development and RAG systems. Driven by robust software design and real-world uses of AI.
  description: >-
    Naël Charvet, software engineer in Paris focused on software development and AI:
    full-stack, RAG systems, projects, CV and contact.
  bio:
    - >-
      I am a software engineer with an MEng in Computer Science from ESIEE Paris (2023–2026),
      including an exchange semester at Heriot-Watt University in 2025. I focus on software
      development and artificial intelligence.
    - >-
      During my final-year internship at EDZO, I developed full-stack features for a SaaS
      platform with Python, FastAPI and React, and designed a dashboard analysing the usage and
      costs of AI models from BigQuery data. Before that, at e-Science Data Factory, I built a
      RAG pipeline integrating OCR, embeddings and vector databases, designed a reporting
      system with OWL, RDF and SPARQL, and developed MCP servers deployed with Docker.
    - >-
      I am driven by robust software design and real-world uses of AI. Outside work, I enjoy
      chess and strategy games, table tennis, which I played for five years, computing and
      hardware, and game and software development.
    - I am available now for a permanent or fixed-term role.
  interests:
    - title: Software development
      description: >-
        Robust, well-designed applications, from Python and FastAPI backends to React
        frontends, and side projects such as a Rust game engine for a strategy-game
        competition platform.
    - title: Artificial intelligence
      description: >-
        Real-world AI: retrieval-augmented generation with embeddings and vector databases,
        Graph-RAG, and computer vision with deep learning frameworks such as PyTorch.
    - title: DevOps
      description: >-
        Containerised services with Docker, Git and GitHub workflows, and automation of
        business processes and data processing.
  links:
    github: https://github.com/Zyosia
    linkedin: https://www.linkedin.com/in/na%C3%ABl-charvet-205b6a201

fr:
  name: Naël Charvet
  jobTitle: Ingénieur informatique, Développement logiciel & IA
  location: Paris, Île-de-France
  photo: ../assets/profile.jpg
  photoAlt: Portrait de Naël Charvet, souriant, avec des lunettes rondes et une chemise sombre
  pitch: >-
    Ingénieur en informatique spécialisé en développement logiciel et en IA, avec une
    expérience en développement full-stack et systèmes RAG. Attaché aux architectures
    logicielles robustes et aux applications concrètes de l’IA.
  description: >-
    Naël Charvet, ingénieur informatique à Paris spécialisé en développement logiciel et IA :
    full-stack, systèmes RAG, projets, CV et contact.
  bio:
    - >-
      Je suis ingénieur en informatique, diplômé d’ESIEE Paris (2023–2026), avec un échange
      universitaire à la Heriot-Watt University en 2025. Je suis spécialisé en développement
      logiciel et en intelligence artificielle.
    - >-
      Lors de mon stage de fin d’études chez EDZO, j’ai développé des fonctionnalités full-stack
      sur une plateforme SaaS avec Python, FastAPI et React, et conçu un dashboard analysant la
      consommation et les coûts des modèles d’IA à partir de données BigQuery. Auparavant, chez
      e-Science Data Factory, j’ai développé un pipeline RAG intégrant OCR, embeddings et bases
      de données vectorielles, mis en place un système de reporting basé sur OWL, RDF et
      SPARQL, et développé des serveurs MCP déployés avec Docker.
    - >-
      Je suis attaché aux architectures logicielles robustes et aux applications concrètes de
      l’IA. En dehors du travail, j’apprécie les échecs et les jeux de stratégie, le tennis de
      table, que j’ai pratiqué pendant cinq ans, l’informatique et le hardware, ainsi que le
      développement de jeux et de logiciels.
    - Je suis disponible immédiatement, en CDI ou CDD.
  interests:
    - title: Développement logiciel
      description: >-
        Des applications robustes et bien conçues, des backends Python et FastAPI aux
        interfaces React, et des projets personnels comme un moteur de jeu en Rust pour une
        plateforme de compétition.
    - title: Intelligence artificielle
      description: >-
        L’IA appliquée : génération augmentée par la recherche (RAG) avec embeddings et bases
        vectorielles, Graph-RAG, et vision par ordinateur avec des frameworks de deep learning
        comme PyTorch.
    - title: DevOps
      description: >-
        Services conteneurisés avec Docker, workflows Git et GitHub, et automatisation de
        processus métier et de traitements de données.
  links:
    github: https://github.com/Zyosia
    linkedin: https://www.linkedin.com/in/na%C3%ABl-charvet-205b6a201
